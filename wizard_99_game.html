<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>九九魔法逃脫</title><style>*{box-sizing:border-box}body{margin:0;background:#10152c;color:#fff;font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:900px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:22px;margin:6px 0}.pill{background:#263456;padding:7px 12px;border-radius:18px;font-size:14px}canvas{width:100%;display:block;background:#172044;border:2px solid #6477ac;border-radius:16px;touch-action:none}.game{position:relative;margin-top:10px}.modal{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;background:#080d22c9;border-radius:16px;padding:12px}.panel{width:min(440px,95%);max-height:95%;overflow:auto;background:#202b50;border:2px solid #8ca4e5;border-radius:18px;text-align:center;padding:18px;box-shadow:0 12px 40px #0009}.panel h2{margin:4px 0 10px;color:#ffe49a}.question{font-size:44px;font-weight:900;margin:10px 0}.answer{font-size:30px;width:140px;text-align:center;border-radius:12px;border:2px solid #9eb5f2;padding:7px;background:white;color:#111}.btn{border:0;background:#f6c75d;color:#28233a;border-radius:13px;padding:12px 18px;font-size:18px;font-weight:800;cursor:pointer}.btn.secondary{background:#405680;color:white}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.controls button{min-height:64px;font-size:21px;touch-action:none}.help{font-size:13px;color:#c2cce5;line-height:1.6}.feedback{min-height:25px;color:#ffcd8c;font-weight:bold}.hidden{display:none!important}.config{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}.config select{background:#fff;border-radius:8px;padding:8px;font-size:16px}.small{font-size:13px;color:#d7e1fc}#status{margin:7px 0}</style></head><body><main><div class="top"><h1>🧙 九九魔法逃脫</h1><span class="pill" id="score">🔐 0 / 10　🪙 0</span></div><div class="config"><label for="table">魔法題目：</label><select id="table"><option value="all">1～9 全部隨機</option><option value="weak">弱點加強</option></select><button class="btn secondary" id="restart">重新開始</button><span class="small" id="accuracy"></span></div><div class="game"><canvas id="scene" width="860" height="420" aria-label="巫師躲避障礙物並解開乘法門鎖的遊戲"></canvas><div class="modal" id="overlay"><div class="panel"><h2 id="modalTitle">🧙 九九魔法逃脫</h2><p id="modalText">小巫師被狼人追趕！上下移動、跳過障礙，遇到魔法門就解開九九乘法。答對 10 題，贏得一枚金幣！</p><div id="quiz" class="hidden"><div class="question" id="question">7 × 8 = ?</div><input class="answer" id="answer" type="number" inputmode="numeric" min="0" placeholder="?" autocomplete="off"><div style="margin-top:12px"><button class="btn" id="submit">施放魔法 ✨</button></div><div class="feedback" id="feedback"></div></div><button class="btn" id="start">開始冒險 ▶</button></div></div></div><div class="controls"><button class="btn secondary" id="up">⬆️ 上移</button><button class="btn" id="jump">🦘 跳躍</button><button class="btn secondary" id="down">⬇️ 下移</button></div><p id="status" class="small">操作：鍵盤 ↑ ↓ 移動，空白鍵跳躍；手機／iPad 點下方按鈕。</p><p class="help">規則：每扇魔法門答對 1 題才能打開。答錯可重試，但狼人會靠近；碰到障礙物也會讓狼人追近。狼人追上就需要重新挑戰本關。答題統計保存在此裝置的瀏覽器中。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('scene'),ctx=c.getContext('2d');const W=860,H=420,lanes=[218,285,352],KEY='wizard99stats-v1',COIN='wizard99coins-v1';let stats={},coins=0;try{stats=JSON.parse(localStorage.getItem(KEY)||'{}');coins=Number(localStorage.getItem(COIN)||0)}catch(e){};for(let i=1;i<=9;i++){$('table').insertAdjacentHTML('beforeend',`<option value="${i}">${i} 的乘法</option>`)}let mode='intro',player={x:215,lane:1,jump:0,vy:0},wolf=35,progress=0,world=0,obstacles=[],gate=null,nextGate=420,spawn=150,frame=0,shake=0,feedbackTimer=0,question=null;const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function save(){try{localStorage.setItem(KEY,JSON.stringify(stats));localStorage.setItem(COIN,String(coins))}catch(e){}}function score(){ $('score').textContent=`🔐 ${progress} / 10　🪙 ${coins}`;let t=0,k=0;Object.values(stats).forEach(s=>{t+=s.total;k+=s.correct});$('accuracy').textContent=`累計 ${t} 題｜正確率 ${t?Math.round(k/t*100):0}%`;}function reset(){player={x:215,lane:1,jump:0,vy:0};wolf=35;progress=0;world=0;obstacles=[];gate=null;nextGate=420;spawn=140;frame=0;shake=0;question=null;score()}function show(title,msg,quiz=false,button='繼續冒險'){$('modalTitle').textContent=title;$('modalText').textContent=msg;$('quiz').classList.toggle('hidden',!quiz);$('start').classList.toggle('hidden',quiz);$('start').textContent=button;$('overlay').classList.remove('hidden');if(quiz){$('answer').value='';$('feedback').textContent='';setTimeout(()=>$('answer').focus(),100)}}function hide(){$('overlay').classList.add('hidden')}function begin(){reset();mode='run';hide()}function pick(){let pool=[];const table=$('table').value;for(let a=1;a<=9;a++)for(let b=1;b<=9;b++){if(table!=='all'&&table!=='weak'&&Number(table)!==a)continue;const s=stats[a+'x'+b]||{total:0,correct:0};let weight=1;if(table==='weak')weight=s.total===0?3:1+8*(1-s.correct/s.total);pool.push({a,b,weight})}let sum=pool.reduce((v,p)=>v+p.weight,0),r=Math.random()*sum;for(const p of pool){r-=p.weight;if(r<=0)return p}return pool[0]}function lock(){mode='quiz';question=pick();show('🔐 魔法門鎖','算出答案，才能打開魔法門！',true);$('question').textContent=`${question.a} × ${question.b} = ?`}function submit(){if(mode!=='quiz'||!question)return;let raw=$('answer').value.trim();if(raw==='')return;const v=Number(raw),correct=v===question.a*question.b,key=question.a+'x'+question.b;let s=stats[key]||{total:0,correct:0};s.total++;if(correct)s.correct++;stats[key]=s;save();score();if(correct){progress++;gate=null;nextGate=world+450;wolf=Math.max(20,wolf-9);mode='run';hide();score();if(progress===10){coins++;save();score();mode='win';show('🏆 闖關成功！','你答對 10 題，成功甩開狼人，獲得 🪙 金幣一枚！',false,'再玩一次')}}else{wolf+=17;$('feedback').textContent='魔法還差一點！再試一次 💪';$('answer').value='';$('answer').focus();shake=12;if(wolf>=player.x-35){mode='lose';show('🐺 狼人追上來了！','這次冒險結束。再練習一次，你一定能更快解開門鎖！',false,'重新挑戰')}}}function move(dir){if(mode==='run')player.lane=clamp(player.lane+dir,0,2)}function jump(){if(mode==='run'&&player.jump===0){player.vy=12;player.jump=.1}}function draw(){ctx.clearRect(0,0,W,H);let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#18244b');sky.addColorStop(1,'#34467a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff9c5';ctx.beginPath();ctx.arc(735,64,29,0,7);ctx.fill();for(let i=0;i<36;i++){let x=(i*151+23-world*.08)%W;if(x<0)x+=W;ctx.fillStyle='#ffffff90';ctx.fillRect(x,16+(i*41)%155,2,2)}for(let i=0;i<9;i++){let x=(i*170-world*.25)%1100-110;ctx.fillStyle='#101c38';ctx.beginPath();ctx.moveTo(x,204);ctx.lineTo(x+85,92+(i%3)*19);ctx.lineTo(x+175,204);ctx.fill()}ctx.fillStyle='#36445d';ctx.fillRect(0,194,W,226);for(let j=0;j<3;j++){ctx.fillStyle=j%2?'#4d5b70':'#46536a';ctx.fillRect(0,194+j*72,W,70);ctx.strokeStyle='#71809a';ctx.setLineDash([25,22]);ctx.beginPath();ctx.moveTo(0,264+j*72);ctx.lineTo(W,264+j*72);ctx.stroke();ctx.setLineDash([])}for(let o of obstacles){let x=o.x-world;if(x<-60||x>W+60)continue;let y=lanes[o.lane];ctx.font='43px serif';ctx.fillText(o.type==='rock'?'🪨':'🌵',x,y+13)}if(gate){let x=gate.x-world;ctx.fillStyle='#7851a5';ctx.fillRect(x-18,178,47,222);ctx.fillStyle='#c5a1ff';ctx.fillRect(x-11,186,33,205);ctx.fillStyle='#40275f';ctx.fillRect(x-5,194,22,193);ctx.font='31px serif';ctx.fillText('🔒',x-15,267)}let y=lanes[player.lane]-player.jump;ctx.font='51px serif';ctx.fillText('🧙',player.x-28,y+13);ctx.font='49px serif';ctx.fillText('🐺',wolf-28,lanes[player.lane]+13);ctx.fillStyle='#fff';ctx.font='bold 17px system-ui';ctx.fillText('狼人',Math.max(4,wolf-18),175);ctx.fillText('小巫師',player.x-27,175);ctx.fillStyle='#ffd76e';ctx.font='bold 20px system-ui';ctx.fillText(`魔法門 ${progress}/10`,22,34);if(shake>0){ctx.fillStyle='#ff334422';ctx.fillRect(0,0,W,H);shake--}}function tick(){requestAnimationFrame(tick);if(mode==='run'){frame++;world+=2.8+progress*.13;wolf+=.025;player.jump=Math.max(0,player.jump+player.vy);if(player.jump>0){player.vy-=.75;if(player.jump<=0){player.jump=0;player.vy=0}}if(frame>spawn){spawn=frame+Math.floor(rnd(75,120));obstacles.push({x:world+W+20,lane:Math.floor(rnd(0,3)),type:Math.random()<.5?'rock':'cactus',hit:false})}if(!gate&&world+W>nextGate){gate={x:nextGate+W*.2}}for(const o of obstacles){let x=o.x-world;if(!o.hit&&Math.abs(x-player.x)<28&&o.lane===player.lane&&player.jump<40){o.hit=true;wolf+=25;shake=10}}obstacles=obstacles.filter(o=>o.x-world>-100);if(gate&&gate.x-world<=player.x+38)lock();if(wolf>=player.x-35&&mode==='run'){mode='lose';show('🐺 狼人追上來了！','碰到障礙物會讓狼人靠近。再試一次吧！',false,'重新挑戰')}}draw()}$('start').onclick=begin;$('restart').onclick=begin;$('submit').onclick=submit;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('jump').onclick=jump;document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowUp')move(-1);if(e.code==='ArrowDown')move(1);if(e.code==='Space')jump()});let startY=0;c.addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-startY;if(Math.abs(dy)>25)move(dy>0?1:-1);else jump()},{passive:true});score();tick()})();
</script></body></html>
