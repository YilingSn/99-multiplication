<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Howie English Flash Cards</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f2f5fa;color:#22304a;margin:0}main{max-width:760px;margin:auto;padding:18px}h1{font-size:26px}.panel{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 2px 8px #22304a0b}button,input,textarea{font:inherit;border-radius:12px;padding:12px;box-sizing:border-box}button{border:1px solid #cbd5e1;background:#fff;color:#22304a;cursor:pointer}button.primary{background:#315bd3;color:white;border:0}button:disabled{opacity:.4}input,textarea{border:1px solid #cbd5e1;width:100%}textarea{min-height:100px}nav{display:flex;gap:8px;flex-wrap:wrap}.word{text-align:center;font-size:clamp(46px,10vw,78px);font-weight:750;margin:40px 0}.hidden{display:none!important}.answer{text-align:center;border-top:1px solid #e2e8f0;padding:16px}.answer img{max-width:230px;max-height:180px;object-fit:contain;border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.muted{color:#697790}.stats{display:flex;gap:12px;justify-content:space-around}.stats strong{font-size:25px;display:block;text-align:center}.small{font-size:13px}.item{border-bottom:1px solid #eee;padding:10px 0}#status{white-space:pre-wrap}</style></head><body><main><h1>📚 Howie English Flash Cards</h1><p class="muted">先看英文 → 自己念並說中文 → Show Answer → 家長評分</p><nav><button onclick="tab('practice')">單字測驗</button><button onclick="tab('add')">新增單字</button><button onclick="tab('records')">學習紀錄</button></nav><section id="practice" class="panel"><div class="stats"><div><strong id="total">0</strong>總單字</div><div><strong id="passed">0</strong>已過關</div><div><strong id="remaining">0</strong>待過關</div></div><p id="round" class="muted"></p><div class="actions"><button onclick="setMode('all')">全部未過關</button><button onclick="setMode('missed')">錯題複習</button></div><div id="word" class="word">載入中</div><button class="primary" style="width:100%" onclick="showAnswer()">Show Answer｜顯示答案</button><div id="answer" class="answer hidden"><div id="image"></div><h2 id="meaning"></h2><p id="phonetic"></p><button onclick="speak()">🔊 聽英文發音</button><p class="small muted">兩項都正確才能按答對</p><div class="actions"><button onclick="grade('pron')">發音錯</button><button onclick="grade('meaning')">意思錯</button><button onclick="grade('both')">兩者都錯</button><button class="primary" onclick="grade('correct')">✓ 都正確</button></div></div><p id="notice" class="muted"></p></section><section id="add" class="panel hidden"><h2>批次新增英文單字</h2><p class="muted">每行一個英文單字。自動查詢繁體中文與圖片；可在下方修正。查詢需要網路，部分圖片可能找不到。</p><textarea id="newWords" placeholder="apple&#10;orange&#10;elephant"></textarea><button class="primary" onclick="addWords()">自動查詢並新增</button><p id="status" class="muted"></p><h3>編輯單字</h3><div id="editor"></div><button onclick="exportData()">匯出完整備份 JSON</button><input type="file" id="import" accept="application/json" onchange="importData(event)" style="margin-top:12px"></section><section id="records" class="panel hidden"><h2>學習紀錄</h2><div id="recordList"></div><button onclick="exportCSV()">匯出 CSV 紀錄</button></section><p class="small muted">紀錄保存在目前瀏覽器。更換裝置、清除網站資料可能遺失，請定期備份。語音使用裝置內建朗讀功能。</p></main><script>
const defaults=[['Helpful','樂於助人的','🤝'],['skate','溜冰；滑冰','⛸️'],['kite','風箏','🪁'],['ripe','成熟的','🍑'],['lime','萊姆；青檸','🍋'],['please','請','🙏'],['welcome','歡迎；不客氣','👋'],['cave','洞穴','🏞️'],['pine','松樹','🌲'],['fine','很好；不錯的','👍']];
const key='howie_flashcards_v6';let cards;try{cards=JSON.parse(localStorage.getItem(key))}catch(e){}if(!Array.isArray(cards))cards=defaults.map(([en,zh,emoji])=>({en,zh,emoji,img:'',phon:'',streak:0,pronWrong:0,meaningWrong:0,round:0,seen:0}));cards=cards.map(c=>({...{streak:0,pronWrong:0,meaningWrong:0,round:0,seen:0,img:'',emoji:'📖',phon:''},...c}));let mode='all',round=1,queue=[],index=0,doneThisRound=new Set();function save(){try{localStorage.setItem(key,JSON.stringify(cards))}catch(e){document.getElementById('notice').textContent='無法儲存紀錄，請匯出備份。'}}function tab(id){for(const x of ['practice','add','records'])document.getElementById(x).classList.toggle('hidden',x!==id);if(id==='records')renderRecords();if(id==='add')renderEditor()}function setMode(m){mode=m;round=1;buildQueue()}function buildQueue(){doneThisRound.clear();queue=cards.filter(c=>c.streak<3&&(mode!=='missed'||c.pronWrong+c.meaningWrong>0)).map(c=>c.en);index=0;render()}function render(){document.getElementById('total').textContent=cards.length;document.getElementById('passed').textContent=cards.filter(c=>c.streak>=3).length;document.getElementById('remaining').textContent=cards.filter(c=>c.streak<3).length;document.getElementById('round').textContent='第 '+round+' 輪 · '+(queue.length?`${Math.min(index+1,queue.length)} / ${queue.length}`:'本模式沒有待測單字');document.getElementById('answer').classList.add('hidden');document.getElementById('word').textContent=queue[index]||'🎉 本輪完成';document.getElementById('notice').textContent=queue.length?'':'可切換模式或新增單字';}function current(){return cards.find(c=>c.en===queue[index])}function showAnswer(){let c=current();if(!c)return;document.getElementById('meaning').textContent=c.zh||'尚無中文，請在新增單字頁補充';document.getElementById('phonetic').textContent=c.phon||'';let img=document.getElementById('image');img.replaceChildren();if(c.img){let el=document.createElement('img');el.src=c.img;el.alt=c.zh;el.onerror=()=>{img.textContent=c.emoji||'📖'};img.appendChild(el)}else{img.textContent=c.emoji||'📖';img.style.fontSize='90px'}document.getElementById('answer').classList.remove('hidden')}function speak(){let c=current();if(!c)return;if(!('speechSynthesis'in window)){alert('此瀏覽器不支援語音');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(c.en);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}function grade(result){let c=current();if(!c)return;if(document.getElementById('answer').classList.contains('hidden')){alert('請先按 Show Answer');return}if(result==='correct'){c.streak=Math.min(3,c.streak+1)}else{c.streak=0;if(result==='pron'||result==='both')c.pronWrong++;if(result==='meaning'||result==='both')c.meaningWrong++}c.seen++;c.round=round;save();index++;if(index>=queue.length){round++;buildQueue()}else render()}
const known=Object.fromEntries(defaults.map(([en,zh,emoji])=>[en.toLowerCase(),{zh,emoji}]));const sleep=ms=>new Promise(r=>setTimeout(r,ms));function safe(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}async function translate(en){let k=known[en.toLowerCase()];if(k)return k.zh;try{let r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(en)+'&langpair=en|zh-TW');let j=await r.json();let v=j.responseData?.translatedText;if(v&&!/MYMEMORY|QUERY LENGTH|INVALID/i.test(v))return v}catch(e){}return ''}async function picture(en){try{let url='https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent('filetype:bitmap '+en)+'&gsrnamespace=6&gsrlimit=5&prop=imageinfo&iiprop=url&iiurlwidth=360&format=json&origin=*';let r=await fetch(url);let j=await r.json();let pages=Object.values(j.query?.pages||{});let p=pages.find(p=>p.imageinfo?.[0]?.thumburl&&/\.(jpg|jpeg|png)$/i.test(p.title));return p?.imageinfo?.[0]?.thumburl||''}catch(e){return ''}}async function phonetic(en){try{let r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(en));let j=await r.json();return j[0]?.phonetic||j[0]?.phonetics?.find(p=>p.text)?.text||''}catch(e){return ''}}async function addWords(){let words=[...new Set(document.getElementById('newWords').value.split(/[\n,，;；]+/).map(s=>s.trim()).filter(Boolean))];let st=document.getElementById('status');if(!words.length){st.textContent='請先輸入單字';return}let added=0;for(let i=0;i<words.length;i++){let en=words[i];st.textContent=`查詢中 ${i+1}/${words.length}：${en}`;if(cards.some(c=>c.en.toLowerCase()===en.toLowerCase()))continue;let [zh,img,phon]=await Promise.all([translate(en),picture(en),phonetic(en)]);cards.push({en,zh,img,phon,emoji:known[en.toLowerCase()]?.emoji||'📖',streak:0,pronWrong:0,meaningWrong:0,round:0,seen:0});added++;save();renderEditor()}st.textContent=`已新增 ${added} 個單字。請檢查自動翻譯及圖片，必要時修改。`;document.getElementById('newWords').value='';buildQueue()}function renderEditor(){let root=document.getElementById('editor');root.replaceChildren();cards.forEach((c,i)=>{let wrap=document.createElement('div');wrap.className='item';let label=document.createElement('b');label.textContent=c.en;wrap.appendChild(label);for(let [prop,title] of [['zh','中文意思'],['img','圖片網址'],['phon','音標']]){let inp=document.createElement('input');inp.value=c[prop]||'';inp.placeholder=title;inp.style.marginTop='6px';inp.onchange=()=>{c[prop]=inp.value;save()};wrap.appendChild(inp)}let del=document.createElement('button');del.textContent='刪除單字';del.style.marginTop='6px';del.onclick=()=>{if(confirm('確定刪除 '+c.en+'？')){cards.splice(i,1);save();renderEditor();buildQueue()}};wrap.appendChild(del);root.appendChild(wrap)})}function renderRecords(){document.getElementById('recordList').innerHTML=cards.map(c=>`<div class="item"><b>${safe(c.en)}</b>　連續正確 ${c.streak}/3 ${c.streak>=3?'🏆':''}<br><span class="muted">發音錯 ${c.pronWrong} 次｜意思錯 ${c.meaningWrong} 次｜測驗 ${c.seen} 次</span></div>`).join('')}function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportData(){download('howie_backup.json',JSON.stringify(cards,null,2),'application/json')}function exportCSV(){let lines=[['English','Chinese','PronunciationWrong','MeaningWrong','ConsecutiveCorrect','TotalAttempts'],...cards.map(c=>[c.en,c.zh,c.pronWrong,c.meaningWrong,c.streak,c.seen])];download('howie_progress.csv','\ufeff'+lines.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}async function importData(e){try{let j=JSON.parse(await e.target.files[0].text());if(!Array.isArray(j)||!j.every(x=>typeof x.en==='string'))throw Error('格式錯誤');if(confirm('以備份取代目前題庫與紀錄？')){cards=j;save();buildQueue();renderEditor()}}catch(err){alert('匯入失敗：'+err.message)}}buildQueue();</script></body></html>
