<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九九乘法練習樂園</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#20334a;background:#f3f7ff}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px}h1{margin:8px 0}p{line-height:1.5}.tabs,.choices{display:flex;flex-wrap:wrap;gap:8px;margin:15px 0}button{border:0;border-radius:13px;padding:12px 17px;background:#e2eaf7;color:#243b57;font-size:17px;cursor:pointer}button.active,.primary{background:#2563eb;color:white}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b}section,.panel{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 3px 18px #20334a0d}.hide{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}.fact{padding:13px;border-radius:12px;background:#f1f5ff;text-align:center;font-size:20px}.passed{background:#dcfce7}.question{text-align:center;font-size:clamp(40px,9vw,76px);font-weight:800;margin:20px 0}input[type=number]{width:170px;max-width:100%;font-size:36px;padding:12px;border:2px solid #b6c7e3;border-radius:14px;text-align:center}.center{text-align:center}.muted{color:#65748b}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#edf4ff;border-radius:14px;text-align:center;padding:15px}.stat b{display:block;font-size:26px}.message{min-height:34px;font-size:20px;font-weight:700}.good{color:#15803d}.bad{color:#b45309}.small{font-size:14px}.bar{height:13px;background:#e2e8f0;border-radius:12px;overflow:hidden}.fill{height:100%;background:#22c55e;transition:width .2s}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:490px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:center}th{background:#eff5ff}label{display:inline-flex;align-items:center;gap:6px}.danger{background:#fff1f2;color:#be123c}@media(max-width:450px){.wrap{padding:12px}section,.panel{padding:15px}.stats{gap:5px}.stat{padding:9px}.stat b{font-size:22px}}</style></head><body><main class="wrap"><h1>🌟 九九乘法練習樂園</h1><p class="muted">每天練一點，答對三次就過關！學習紀錄保存在這台裝置的瀏覽器中。</p><nav class="tabs" aria-label="學習模式"><button data-tab="study" class="active">📖 背誦</button><button data-tab="single">✏️ 單組練習</button><button data-tab="random">🎲 全部隨機</button><button data-tab="weak">🎯 弱點加強</button><button data-tab="report">📊 學習報告</button></nav><section id="study"><h2>背誦乘法表</h2><div id="studyChoices" class="choices"></div><p class="muted">可以先看答案朗讀，再隱藏答案挑戰自己。</p><label><input id="showAnswers" type="checkbox" checked> 顯示答案</label><div id="studyFacts" class="grid" style="margin-top:16px"></div></section><section id="practice" class="hide"><h2 id="modeTitle">練習</h2><div id="singleOptions" class="choices"></div><div class="stats"><div class="stat">本次答題<b id="sessionCount">0</b></div><div class="stat">本次正確率<b id="sessionAccuracy">—</b></div><div class="stat">已過關題數<b id="passCount">0</b></div></div><div class="question" id="question">2 × 3 = ?</div><div class="center"><form id="answerForm"><input type="number" id="answer" inputmode="numeric" min="0" max="100" autocomplete="off" aria-label="輸入乘法答案" required><button class="primary" type="submit">送出答案</button></form><p id="feedback" class="message" aria-live="polite"></p><p id="questionProgress" class="muted"></p><button id="next" class="primary hide">下一題 →</button></div><div class="panel"><div class="bar"><div class="fill" id="progressFill" style="width:0%"></div></div><p id="progressText" class="small muted"></p></div></section><section id="report" class="hide"><h2>學習報告</h2><div class="stats"><div class="stat">總答題次數<b id="totalAttempts">0</b></div><div class="stat">總正確率<b id="totalAccuracy">—</b></div><div class="stat">PASS 題數<b id="totalPassed">0/81</b></div></div><p class="small muted">PASS 規則：同一道題累積答對 3 次（不必連續）。答錯不會扣除已累積的正確次數。</p><div class="choices"><label>查看組別 <select id="reportGroup" style="padding:10px;border-radius:10px"><option value="all">全部</option></select></label><button id="exportData">匯出紀錄 CSV</button><button id="resetData" class="danger">清除所有紀錄</button></div><div class="tablewrap"><table><thead><tr><th>題目</th><th>答題次數</th><th>答對次數</th><th>正確率</th><th>進度</th></tr></thead><tbody id="reportRows"></tbody></table></div></section></main><script>(()=>{'use strict';const KEY='multiplication99_v1';const $=id=>document.getElementById(id);const facts=Array.from({length:9},(_,i)=>Array.from({length:9},(_,j)=>[i+1,j+1])).flat();let data={};try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object')data=v}catch{};const rec=(a,b)=>{const x=data[`${a}x${b}`]||{};return {attempts:Math.max(0,Number(x.attempts)||0),correct:Math.max(0,Number(x.correct)||0)}};let tab='study',studyGroup=2,singleGroup=2,current=null,answered=false,session={attempts:0,correct:0},lastKey=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('瀏覽器無法儲存紀錄，請確認儲存空間或隱私模式。')}};const pass=(a,b)=>rec(a,b).correct>=3;const pct=(c,n)=>n?Math.round(100*c/n)+'%':'—';const rand=arr=>arr[Math.floor(Math.random()*arr.length)];function weighted(items){let weights=items.map(([a,b])=>{const r=rec(a,b);return r.attempts===0?4:1+9*(1-r.correct/r.attempts)+(r.correct<3?2:0)});let sum=weights.reduce((a,b)=>a+b,0),v=Math.random()*sum;for(let i=0;i<items.length;i++){v-=weights[i];if(v<=0)return items[i]}return items.at(-1)}function setTab(t){tab=t;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));$('study').classList.toggle('hide',t!=='study');$('practice').classList.toggle('hide',!['single','random','weak'].includes(t));$('report').classList.toggle('hide',t!=='report');if(t==='study')drawStudy();if(t==='report')drawReport();if(['single','random','weak'].includes(t)){session={attempts:0,correct:0};$('singleOptions').classList.toggle('hide',t!=='single');$('modeTitle').textContent={single:'單組乘法練習',random:'全部 81 題隨機練習',weak:'依正確率加強弱點'}[t];drawSingleChoices();newQuestion();}}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));function drawStudy(){const e=$('studyChoices');e.replaceChildren();for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=`${n} 的乘法`;b.className=n===studyGroup?'active':'';b.onclick=()=>{studyGroup=n;drawStudy()};e.append(b)}const g=$('studyFacts');g.replaceChildren();for(let b=1;b<=9;b++){const d=document.createElement('div');d.className='fact'+(pass(studyGroup,b)?' passed':'');d.textContent=`${studyGroup} × ${b} = ${$('showAnswers').checked?studyGroup*b:'？'}`;g.append(d)}}$('showAnswers').addEventListener('change',drawStudy);function drawSingleChoices(){const e=$('singleOptions');e.replaceChildren();for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=`${n} 的乘法`;b.className=n===singleGroup?'active':'';b.onclick=()=>{singleGroup=n;session={attempts:0,correct:0};drawSingleChoices();newQuestion()};e.append(b)}}function pool(){return tab==='single'?facts.filter(([a])=>a===singleGroup):facts}function newQuestion(){let items=pool();if(tab==='single'){const unfinished=items.filter(([a,b])=>!pass(a,b));if(unfinished.length)items=unfinished}if(items.length>1){const other=items.filter(([a,b])=>`${a}x${b}`!==lastKey);if(other.length)items=other}current=tab==='weak'?weighted(items):rand(items);lastKey=`${current[0]}x${current[1]}`;answered=false;$('question').textContent=`${current[0]} × ${current[1]} = ?`;$('answer').value='';$('answer').disabled=false;$('answerForm').querySelector('button').disabled=false;$('feedback').textContent='';$('feedback').className='message';$('next').classList.add('hide');updatePractice();$('answer').focus()}function updatePractice(){const items=pool(),done=items.filter(([a,b])=>pass(a,b)).length;$('sessionCount').textContent=session.attempts;$('sessionAccuracy').textContent=pct(session.correct,session.attempts);$('passCount').textContent=done;$('progressFill').style.width=(done/items.length*100)+'%';$('progressText').textContent=`已通過 ${done} / ${items.length} 題`;if(current){const r=rec(...current);$('questionProgress').textContent=`這一題累積答對 ${Math.min(r.correct,3)} / 3 次 ${r.correct>=3?'✅ PASS':''}`}}$('answerForm').addEventListener('submit',e=>{e.preventDefault();if(answered||!current)return;const input=$('answer');if(input.value.trim()==='')return;const [a,b]=current;const right=Number(input.value)===a*b;const key=`${a}x${b}`,r=rec(a,b);r.attempts++;if(right)r.correct++;data[key]=r;save();session.attempts++;if(right)session.correct++;answered=true;input.disabled=true;$('answerForm').querySelector('button').disabled=true;$('feedback').textContent=right?(r.correct===3?'🎉 答對！這題 PASS 過關！':'✅ 答對了，太棒了！'):`再記一次：${a} × ${b} = ${a*b}`;$('feedback').className='message '+(right?'good':'bad');$('next').classList.remove('hide');updatePractice();$('next').focus()});$('next').addEventListener('click',newQuestion);function drawReport(){let attempts=0,correct=0,passed=0;for(const [a,b] of facts){const r=rec(a,b);attempts+=r.attempts;correct+=r.correct;if(pass(a,b))passed++}$('totalAttempts').textContent=attempts;$('totalAccuracy').textContent=pct(correct,attempts);$('totalPassed').textContent=`${passed}/81`;const group=$('reportGroup').value,body=$('reportRows');body.replaceChildren();for(const [a,b] of facts){if(group!=='all'&&Number(group)!==a)continue;const r=rec(a,b),tr=document.createElement('tr');[`${a} × ${b}`,r.attempts,r.correct,pct(r.correct,r.attempts),pass(a,b)?'✅ PASS':`${Math.min(r.correct,3)}/3`].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.append(td)});body.append(tr)}}for(let i=1;i<=9;i++){const o=document.createElement('option');o.value=i;o.textContent=`${i} 的乘法`;$('reportGroup').append(o)}$('reportGroup').addEventListener('change',drawReport);$('resetData').addEventListener('click',()=>{if(confirm('確定清除全部 81 題的答題紀錄嗎？此操作無法復原。')){data={};save();drawReport()}});$('exportData').addEventListener('click',()=>{const rows=[['題目','答題次數','答對次數','正確率','PASS']];for(const [a,b] of facts){const r=rec(a,b);rows.push([`${a}x${b}`,r.attempts,r.correct,pct(r.correct,r.attempts),pass(a,b)?'YES':'NO'])}const csv='\ufeff'+rows.map(r=>r.join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='九九乘法學習紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});drawStudy()})();</script></body></html>
